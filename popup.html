<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles/popup.css">
</head>
<body>
  <div class="container">

    <!-- Шапка -->
    <div class="header">
      <span class="logo">ZY Trading</span>
      <div class="header-right">
        <button id="clear-btn" class="clear-btn" hidden>Очистить</button>
        <button id="logout-btn" class="clear-btn" hidden>Выйти</button>
        <span class="version">v2.2</span>
      </div>
    </div>

    <!-- Вход по токену -->
    <section class="section" id="auth-view" hidden>
      <form id="auth-form" class="auth-form">
        <div class="field">
          <label for="apiKey">Токен доступа</label>
          <input type="password" id="apiKey" placeholder="zyt_..." autocomplete="off" required aria-describedby="auth-hint" />
        </div>
        <div class="tv-hint" id="auth-hint">
          Создайте токен на сайте ZY Trading в разделе «Доступ»
        </div>
        <button type="submit" id="auth-btn" class="submit-btn">Войти</button>
        <div id="auth-status" class="status hidden" role="status" aria-live="polite"></div>
      </form>
    </section>

    <div id="app-view" hidden>

    <!-- Секция 1: Основные параметры -->
    <section class="section">
      <div class="row">
        <!-- Стратегия (select) -->
        <div class="field">
          <label>Стратегия</label>
          <select id="strategy">
            <option value="Пробой">Пробой</option>
            <option value="Ложный Пробой">Ложный Пробой</option>
            <option value="Отбой">Отбой</option>
          </select>
        </div>

        <!-- Рынок (select) -->
        <div class="field">
          <label>Рынок</label>
          <select id="marketType">
            <option value="crypto">Крипто</option>
            <option value="stocks">Акции</option>
            <option value="forex">Форекс</option>
          </select>
        </div>
      </div>

      <div class="row">
        <!-- Тикер (text input, uppercase) -->
        <div class="field">
          <label>Тикер</label>
          <input type="text" id="ticker" placeholder="BTCUSDT" />
        </div>

        <!-- Направление (toggle Long/Short) -->
        <div class="field">
          <label>Направление</label>
          <div class="direction-toggle">
            <button id="btn-long" class="dir-btn active long-active">Long</button>
            <button id="btn-short" class="dir-btn">Short</button>
          </div>
        </div>
      </div>

      <div class="row">
        <!-- Уровень входа -->
        <div class="field">
          <label>Уровень</label>
          <input type="number" id="entryRaw" placeholder="0.00" step="any" />
        </div>

        <!-- Стоп (опционально) -->
        <div class="field">
          <label>SL уровень <span class="optional">(опц.)</span></label>
          <input type="number" id="customStop" placeholder="0.00" step="any" />
        </div>
      </div>

      <!-- ATR и PassRoad с TradingView -->
      <div class="row">
        <div class="field">
          <label>ATR <span class="from-tv">из TV лейбла 📏</span></label>
          <input type="number" id="atrOverride" placeholder="0.00" step="any" min="0" />
        </div>
        <div class="field">
          <label>Прошёл % <span class="from-tv">из TV лейбла 📍</span></label>
          <input type="number" id="passRoadOverride" placeholder="0.0" step="0.1" min="0" max="1000" />
        </div>
      </div>
      <div class="tv-hint" id="tv-hint">
        💡 Смотри лейбл индикатора ATR ZY на графике
      </div>
    </section>

    <!-- Секция 2: Параметры риска (сворачиваемая) -->
    <section class="section collapsible">
      <div class="section-header" id="toggle-risk">
        <span>Параметры риска</span>
        <span class="chevron">▼</span>
      </div>
      <div class="section-body collapsed" id="risk-body">
        <div class="row">
          <div class="field">
            <label>Риск %</label>
            <input type="number" id="riskPercent" value="15" min="1" max="100" />
          </div>
          <div class="field">
            <label>Ratio</label>
            <input type="number" id="ratio" value="3" min="1" max="10" />
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label>Люфт %</label>
            <input type="number" id="luftPercent" value="20" min="0" max="50" />
          </div>
          <div class="field">
            <label>Сумма риска $</label>
            <input type="number" id="riskSum" value="15" min="1" />
          </div>
        </div>
        <!-- InPlay checkbox -->
        <div class="row">
          <label class="checkbox-label">
            <input type="checkbox" id="inPlay" />
            <span>InPlay</span>
          </label>
        </div>
      </div>
    </section>

    <!-- Секция 3: Чек-лист (сворачиваемая) -->
    <section class="section collapsible">
      <div class="section-header" id="toggle-checklist">
        <span>Чек-лист <span id="checklist-count" class="badge">0</span></span>
        <span class="chevron">▼</span>
      </div>
      <div class="section-body collapsed" id="checklist-body">

        <!-- ПРЕДПОСЫЛКИ -->
        <div class="checklist-group">
          <div class="group-title plus">✅ ПРЕДПОСЫЛКИ</div>
          <div id="checklist-plus" class="checklist-items"></div>
        </div>

        <!-- МИНУСЫ -->
        <div class="checklist-group">
          <div class="group-title minus">❌ МИНУСЫ</div>
          <div id="checklist-minus" class="checklist-items"></div>
        </div>

        <!-- ОЖИДАЮ -->
        <div class="checklist-group">
          <div class="group-title wait">⏳ ОЖИДАЮ</div>
          <div id="checklist-wait" class="checklist-items"></div>
        </div>

      </div>
    </section>

    <!-- Секция 4: Управление сделкой -->
    <section class="section collapsible">
      <div class="section-header" id="toggle-deal">
        <span>Управление сделкой</span>
        <span class="chevron">▼</span>
      </div>
      <div class="section-body collapsed" id="deal-body">

        <div class="row">
          <div class="field">
            <label for="deal-select">Сделка</label>
            <select id="deal-select"></select>
          </div>
        </div>
        <div class="tv-hint" id="deal-empty" hidden>Нет открытых сделок: ждут входа только сетапы за последние 3 дня</div>

        <!-- Вход: сетап ждёт исполнения ордера -->
        <div id="entry-block" hidden>
          <div class="row">
            <div class="field">
              <label for="actual-entry">Цена входа</label>
              <input type="number" id="actual-entry" placeholder="цена ордера" step="any" />
            </div>
          </div>

          <div class="row">
            <label class="checkbox-label">
              <input type="checkbox" id="entry-now" checked />
              <span>Вход сейчас</span>
            </label>
          </div>
          <div class="row" id="entry-time-row" hidden>
            <div class="field">
              <label for="entry-time">Время входа</label>
              <input type="datetime-local" id="entry-time" />
            </div>
          </div>

          <div class="deal-actions">
            <button id="btn-entered" class="deal-btn entered">
              📸 Вошёл
            </button>
            <button id="btn-missed" class="deal-btn missed">
              ⏭ Пропустил
            </button>
          </div>
        </div>

        <!-- Выход: позиция открыта -->
        <div id="exit-block" hidden>
          <div class="exit-buttons" id="exit-buttons"></div>
          <label for="close-price">Другая цена</label>
          <div class="row close-row">
            <input type="number" id="close-price" placeholder="0.00" step="any" />
            <button id="btn-close-deal" class="deal-btn close">📸 Закрыть сделку</button>
          </div>
        </div>

        <!-- Статус операции -->
        <div id="deal-status" class="status hidden"></div>

      </div>
    </section>

    <!-- Кнопка отправки -->
    <button id="submit-btn" class="submit-btn">
      Отправить сценарий
    </button>

    <!-- Статус -->
    <div id="status" class="status hidden"></div>

    </div>

  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
