<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles/popup.css">
</head>
<body>
  <div class="container">

    <!-- Шапка -->
    <div class="header">
      <span class="logo">ZY Trading</span>
      <div class="header-right">
        <button id="clear-btn" class="clear-btn">Очистить</button>
        <span class="version">v2.0</span>
      </div>
    </div>

    <!-- Секция 1: Основные параметры -->
    <section class="section">
      <div class="row">
        <!-- Стратегия (select) -->
        <div class="field">
          <label>Стратегия</label>
          <select id="strategy">
            <option value="Пробой">Пробой</option>
            <option value="Ложный Пробой">Ложный Пробой</option>
            <option value="Отбой">Отбой</option>
          </select>
        </div>

        <!-- Рынок (select) -->
        <div class="field">
          <label>Рынок</label>
          <select id="marketType">
            <option value="crypto">Крипто</option>
            <option value="stocks">Акции</option>
            <option value="forex">Форекс</option>
          </select>
        </div>
      </div>

      <div class="row">
        <!-- Тикер (text input, uppercase) -->
        <div class="field">
          <label>Тикер</label>
          <input type="text" id="ticker" placeholder="BTCUSDT" />
        </div>

        <!-- Направление (toggle Long/Short) -->
        <div class="field">
          <label>Направление</label>
          <div class="direction-toggle">
            <button id="btn-long" class="dir-btn active long-active">Long</button>
            <button id="btn-short" class="dir-btn">Short</button>
          </div>
        </div>
      </div>

      <div class="row">
        <!-- Уровень входа -->
        <div class="field">
          <label>Уровень</label>
          <input type="number" id="entryRaw" placeholder="0.00" step="any" />
        </div>

        <!-- Стоп (опционально) -->
        <div class="field">
          <label>SL уровень <span class="optional">(опц.)</span></label>
          <input type="number" id="customStop" placeholder="0.00" step="any" />
        </div>
      </div>
    </section>

    <!-- Секция 2: Параметры риска (сворачиваемая) -->
    <section class="section collapsible">
      <div class="section-header" id="toggle-risk">
        <span>Параметры риска</span>
        <span class="chevron">▼</span>
      </div>
      <div class="section-body collapsed" id="risk-body">
        <div class="row">
          <div class="field">
            <label>Риск %</label>
            <input type="number" id="riskPercent" value="15" min="1" max="100" />
          </div>
          <div class="field">
            <label>Ratio</label>
            <input type="number" id="ratio" value="3" min="1" max="10" />
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label>Люфт %</label>
            <input type="number" id="luftPercent" value="20" min="0" max="50" />
          </div>
          <div class="field">
            <label>Сумма риска $</label>
            <input type="number" id="riskSum" value="15" min="1" />
          </div>
        </div>
        <!-- InPlay checkbox -->
        <div class="row">
          <label class="checkbox-label">
            <input type="checkbox" id="inPlay" />
            <span>InPlay</span>
          </label>
        </div>
      </div>
    </section>

    <!-- Секция 3: Чек-лист (сворачиваемая) -->
    <section class="section collapsible">
      <div class="section-header" id="toggle-checklist">
        <span>Чек-лист <span id="checklist-count" class="badge">0</span></span>
        <span class="chevron">▼</span>
      </div>
      <div class="section-body collapsed" id="checklist-body">

        <!-- ПРЕДПОСЫЛКИ -->
        <div class="checklist-group">
          <div class="group-title plus">✅ ПРЕДПОСЫЛКИ</div>
          <div id="checklist-plus" class="checklist-items"></div>
        </div>

        <!-- МИНУСЫ -->
        <div class="checklist-group">
          <div class="group-title minus">❌ МИНУСЫ</div>
          <div id="checklist-minus" class="checklist-items"></div>
        </div>

        <!-- ОЖИДАЮ -->
        <div class="checklist-group">
          <div class="group-title wait">⏳ ОЖИДАЮ</div>
          <div id="checklist-wait" class="checklist-items"></div>
        </div>

      </div>
    </section>

    <!-- Секция 4: Управление сделкой -->
    <section class="section collapsible">
      <div class="section-header" id="toggle-deal">
        <span>Управление сделкой</span>
        <span class="chevron">▼</span>
      </div>
      <div class="section-body collapsed" id="deal-body">

        <div class="row">
          <div class="field">
            <label>ID сделки</label>
            <input type="number" id="deal-id" placeholder="123" min="1" />
          </div>
        </div>

        <!-- Кнопки входа/пропуска -->
        <div class="deal-actions">
          <button id="btn-entered" class="deal-btn entered">
            📸 Вошёл
          </button>
          <button id="btn-missed" class="deal-btn missed">
            ⏭ Пропустил
          </button>
        </div>

        <!-- Закрытие сделки -->
        <div class="close-deal-section">
          <div class="row">
            <div class="field">
              <label>Цена закрытия</label>
              <input type="number" id="close-price" placeholder="0.00" step="any" />
            </div>
            <div class="field">
              <label>Результат</label>
              <select id="deal-result">
                <option value="win">Win ✅</option>
                <option value="loss">Loss ❌</option>
                <option value="breakeven">BE ➖</option>
              </select>
            </div>
          </div>
          <button id="btn-close-deal" class="deal-btn close">
            📸 Закрыть сделку
          </button>
        </div>

        <!-- Статус операции -->
        <div id="deal-status" class="status hidden"></div>

      </div>
    </section>

    <!-- Кнопка отправки -->
    <button id="submit-btn" class="submit-btn">
      Отправить сценарий
    </button>

    <!-- Статус -->
    <div id="status" class="status hidden"></div>

  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
